name: ChronapseCP — Hourly Contest Sync

on:
  # Scheduled trigger: runs at the top of every hour (UTC)
  schedule:
    - cron: '0 * * * *'

  # Manual trigger: lets you run the workflow from the Actions tab anytime
  workflow_dispatch:

jobs:
  sync:
    name: Fetch, Calendar & WhatsApp Sync
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js 18 with npm dependency caching
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Install production dependencies only
      - name: Install dependencies
        run: npm ci --omit=dev

      # 4. Run the ChronapseCP sync script
      - name: Run ChronapseCP
        env:
          MONGO_URI:                    ${{ secrets.MONGO_URI }}
          TWILIO_SID:                   ${{ secrets.TWILIO_SID }}
          TWILIO_AUTH:                  ${{ secrets.TWILIO_AUTH }}
          MY_PHONE_NUMBER:              ${{ secrets.MY_PHONE_NUMBER }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY:           ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_CALENDAR_ID:           ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: node index.js
